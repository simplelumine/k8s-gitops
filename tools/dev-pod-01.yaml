---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-dev-01-home
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dev-01
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-dev-01
  template:
    metadata:
      labels:
        app: k8s-dev-01
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - lax-wk-01
      hostname: k8s-dev-01
      containers:
        - name: dev
          image: debian:latest
          command:
            - /bin/bash
            - -c
            - |
              apt-get update && \
              apt-get install -y openssh-server curl wget git vim htop ansible age ca-certificates gnupg jq iputils-ping dnsutils iproute2 locales && \
              echo "en_US.UTF-8 UTF-8" > /etc/locale.gen && locale-gen en_US.UTF-8 && update-locale LANG=en_US.UTF-8 && \
              curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && \
              apt-get install -y nodejs && \
              curl -fsSL -o /usr/share/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg && \
              chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null && \
              apt-get update && \
              apt-get install -y gh && \
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && \
              chmod +x kubectl && mv kubectl /usr/local/bin/ && \
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash && \
              curl -L -o /tmp/k9s.tar.gz https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_amd64.tar.gz && \
              tar -xzf /tmp/k9s.tar.gz -C /usr/local/bin k9s && \
              rm /tmp/k9s.tar.gz && \
              curl -s https://fluxcd.io/install.sh | bash && \
              SOPS_VER=$(curl -s https://api.github.com/repos/getsops/sops/releases/latest | grep tag_name | cut -d '"' -f 4) && \
              [ -z "$SOPS_VER" ] && SOPS_VER="v3.9.0"; \
              curl -sLo /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.amd64" && \
              chmod +x /usr/local/bin/sops && \
              chmod 700 /root && \
              mkdir -p /run/sshd /root/.ssh /root/.ssh-host-keys && \
              cp /tmp/ssh/authorized_keys /root/.ssh/authorized_keys && \
              chmod 700 /root/.ssh && \
              chmod 600 /root/.ssh/authorized_keys && \
              if [ ! -f /root/.ssh-host-keys/ssh_host_ed25519_key ]; then \
                ssh-keygen -A && \
                cp /etc/ssh/ssh_host_*_key* /root/.ssh-host-keys/; \
              fi && \
              cp /root/.ssh-host-keys/ssh_host_*_key* /etc/ssh/ && \
              chmod 600 /etc/ssh/ssh_host_*_key && \
              chmod 644 /etc/ssh/ssh_host_*_key.pub && \
              sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config && \
              sed -i -E 's/^#?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && \
              exec /usr/sbin/sshd -D
          env:
            - name: LANG
              value: "en_US.UTF-8"
            - name: LC_ALL
              value: "en_US.UTF-8"
            - name: HTTP_PROXY
              value: "http://xray-sfo-wk-01.xray-client.svc:1081"
            - name: HTTPS_PROXY
              value: "http://xray-sfo-wk-01.xray-client.svc:1081"
            - name: ALL_PROXY
              value: "socks5://xray-sfo-wk-01.xray-client.svc:1080"
            - name: NO_PROXY
              value: "10.0.0.0/8,192.168.0.0/16,100.64.0.0/10,localhost,127.0.0.1,.svc,.cluster.local"
          volumeMounts:
            - name: home
              mountPath: /root
            - name: ssh-key
              mountPath: /tmp/ssh
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "4Gi"
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: k8s-dev-01-home
        - name: ssh-key
          configMap:
            name: dev-ssh-key
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-dev-01-ssh
  namespace: dev
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "k8s-dev-01"
spec:
  selector:
    app: k8s-dev-01
  ports:
    - port: 22
      targetPort: 22
