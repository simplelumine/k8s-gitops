apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  chart:
    spec:
      chart: forgejo
      version: "17.1.5"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values: {}
