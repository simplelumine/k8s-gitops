apiVersion: v1
kind: Service
metadata:
  name: xray-pool
  namespace: xray-client
  labels:
    app.kubernetes.io/name: xray-client
spec:
  selector:
    app.kubernetes.io/name: xray-client
  ports:
    - name: socks5
      port: 1080
      targetPort: 1080
    - name: http
      port: 1081
      targetPort: 1081
