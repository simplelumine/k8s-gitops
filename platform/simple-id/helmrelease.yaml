apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-id
  namespace: simple-id
spec:
  interval: 6h
  chart:
    spec:
      chart: simple-id-chart
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: simple-id
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
