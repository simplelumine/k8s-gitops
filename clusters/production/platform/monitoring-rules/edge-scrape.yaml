apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: external-node-exporter
  namespace: monitoring
spec:
  jobName: "node-exporter"

  targetEndpoints:
    - targets:
        - "100.123.250.26:9100"
      interval: "60s"
      labels:
        instance: "lax-eg-01"
        node: "lax-eg-01"
        region: "los-angeles"
        node_type: "edge"

    - targets:
        - "100.96.1.11:9100"
      interval: "60s"
      labels:
        instance: "tyo-eg-01"
        node: "tyo-eg-01"
        region: "tokyo"
        node_type: "edge"
