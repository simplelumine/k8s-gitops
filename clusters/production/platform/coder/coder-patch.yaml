apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
  namespace: coder
spec:
  values:
    coder:
      env:
        - name: CODER_ACCESS_URL
          value: "https://code.simplelumine.dev"
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-db-url
              key: url
        - name: CODER_TELEMETRY_ENABLE
          value: "false"
        - name: CODER_PROMETHEUS_ENABLE
          value: "true"
        - name: CODER_PROVISIONER_DAEMONS
          value: "3"
        # --- OIDC Single Sign-On (-> ZITADEL) ---
        - name: CODER_OIDC_ISSUER_URL
          value: "https://auth.simplelumine.dev"
        - name: CODER_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: coder-secrets
              key: OIDC_CLIENT_ID
        - name: CODER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: coder-secrets
              key: OIDC_CLIENT_SECRET
        - name: CODER_OIDC_SIGN_IN_TEXT
          value: "Sign in with SimpleLumine SSO"
        - name: CODER_OIDC_SCOPES
          value: "openid,profile,email,offline_access"
        - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
          value: "true"
        # --- Pure SSO: Disable Native Password Auth ---
        - name: CODER_DISABLE_PASSWORD_AUTH
          value: "true"
        # --- Network & Security Optimizations ---
        - name: CODER_DERP_FORCE_WEBSOCKETS
          value: "true"
        - name: CODER_HOST_PREFIX_COOKIE
          value: "true"
      serviceAccount:
        workspacePerms: true
        enableDeployments: true
      service:
        type: ClusterIP
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "coder"
      ingress:
        enable: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 3000m
          memory: 2Gi
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    cnpg.io/cluster: postgres
                    cnpg.io/instanceRole: primary
                topologyKey: topology.kubernetes.io/zone
