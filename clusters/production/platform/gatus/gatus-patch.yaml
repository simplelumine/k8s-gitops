apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  values:
    envFrom:
      - secretRef:
          name: gatus-secrets
    service:
      type: ClusterIP
    persistence:
      enabled: false
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 32Mi

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - status.simplelumine.dev
      tls:
        - secretName: gatus-tls
          hosts:
            - status.simplelumine.dev

    config:
      ui:
        default-sort-by: group
      endpoints:
        # --- 1. SimpleLumine ---
        - name: Open WebUI
          group: 1. SimpleLumine
          url: "https://chat.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Simple Hub
          group: 1. SimpleLumine
          url: "https://hub-test.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Simple API
          group: 1. SimpleLumine
          url: "https://api-test.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] < 500"

        - name: Simple Gemini
          group: 1. SimpleLumine
          url: "http://simple-gemini-worker.simple-gemini.svc.cluster.local:8080/v1beta/models"
          interval: 60s
          headers:
            x-goog-api-key: "${GEMINI_API_KEY}"
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: ZITADEL
          group: 1. SimpleLumine
          url: "https://auth.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Gatus
          group: 1. SimpleLumine
          url: "https://status.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        # --- 2. Simple Gemini ---
        - name: "AI Studio"
          group: 2. Simple Gemini
          url: "http://simple-gemini-worker.simple-gemini.svc.cluster.local:8080/v1beta/models/aistudio/gemini-flash-lite-latest:generateContent"
          interval: 6h
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Antigravity"
          group: 2. Simple Gemini
          url: "http://simple-gemini-worker.simple-gemini.svc.cluster.local:8080/v1beta/models/antigravity/gemini-flash-lite-latest:generateContent"
          interval: 6h
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Gemini APP"
          group: 2. Simple Gemini
          url: "http://simple-gemini-worker.simple-gemini.svc.cluster.local:8080/v1beta/models/gemini-app/gemini-flash-lite-latest:generateContent"
          interval: 6h
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Labs Flow"
          group: 2. Simple Gemini
          url: "http://simple-gemini-worker.simple-gemini.svc.cluster.local:8080/v1beta/models/labs-flow/gemini-3.1-flash-lite-image:generateContent"
          interval: 6h
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"parts":[{"text":"draw a cat"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        # --- 3. TextVerse ---
        - name: SillyTavern
          group: 3. TextVerse
          url: "https://st.textverse.space"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Space Card
          group: 3. TextVerse
          url: "https://sc-assets.textverse.space"
          interval: 60s
          conditions:
            - "[STATUS] < 500"

        # --- 4. Internal ---
        - name: Vaultwarden
          group: 4. Internal
          url: "https://vault.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Ghostfolio
          group: 4. Internal
          url: "https://invest.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Grafana
          group: 4. Internal
          url: "https://monitor.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Headlamp
          group: 4. Internal
          url: "https://k8s.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] < 500"
