apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  values:
    envFrom:
      - secretRef:
          name: gatus-secrets
      - secretRef:
          name: gatus-db-secret
    service:
      type: ClusterIP
    persistence:
      enabled: false
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 20m
        memory: 16Mi

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - status.simplelumine.dev
      tls:
        - secretName: gatus-tls
          hosts:
            - status.simplelumine.dev

    config:
      storage:
        type: postgres
        path: "${DATABASE_URL}"
      ui:
        default-sort-by: group
      endpoints:
        # --- 2. SimpleLumine ---
        - name: Open WebUI
          group: 2. SimpleLumine
          url: "https://chat.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Simple Console
          group: 2. SimpleLumine
          url: "https://console.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Simple API
          group: 2. SimpleLumine
          url: "https://api.simplelumine.dev/v1beta/models"
          interval: 60s
          headers:
            x-goog-api-key: "${GEMINI_API_KEY}"
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: ZITADEL
          group: 2. SimpleLumine
          url: "https://auth.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Gatus
          group: 2. SimpleLumine
          url: "https://status.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Outline
          group: 2. SimpleLumine
          url: "https://docs.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        # --- 1. Gemini ---
        - name: "Vega"
          group: 1. Gemini
          url: "https://api.simplelumine.dev/v1beta/models/vega/gemini-flash-lite-latest:generateContent"
          interval: 6h
          client:
            timeout: 30s
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Spica"
          group: 1. Gemini
          url: "https://api.simplelumine.dev/v1beta/models/spica/gemini-3.5-flash-lite:generateContent"
          interval: 6h
          client:
            timeout: 30s
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Altair"
          group: 1. Gemini
          url: "https://api.simplelumine.dev/v1beta/models/altair/gemini-flash-lite-latest:generateContent"
          interval: 6h
          client:
            timeout: 30s
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Rigel"
          group: 1. Gemini
          url: "https://api.simplelumine.dev/v1beta/models/rigel/gemini-flash-latest:generateContent"
          interval: 6h
          client:
            timeout: 30s
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Sirius"
          group: 1. Gemini
          url: "https://api.simplelumine.dev/v1beta/models/sirius/gemini-flash-lite-latest:generateContent"
          interval: 6h
          client:
            timeout: 30s
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        - name: "Deneb"
          group: 1. Gemini
          url: "https://api.simplelumine.dev/v1beta/models/deneb/gemini-3.1-flash-lite-image:generateContent"
          interval: 6h
          client:
            timeout: 60s
          method: POST
          headers:
            Content-Type: "application/json"
            x-goog-api-key: "${GEMINI_API_KEY}"
          body: '{"contents":[{"parts":[{"text":"draw a cat"}]}]}'
          conditions:
            - "[STATUS] == 200"
          ui:
            hide-url: true
            hide-hostname: true

        # --- 3. TextVerse ---
        - name: SillyTavern
          group: 3. TextVerse
          url: "https://st.textverse.space"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Space Card
          group: 3. TextVerse
          url: "https://sc-assets.textverse.space"
          interval: 60s
          conditions:
            - "[STATUS] < 500"

        # --- 4. Internal ---
        - name: Vaultwarden
          group: 4. Internal
          url: "https://vault.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Ghostfolio
          group: 4. Internal
          url: "https://invest.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Grafana
          group: 4. Internal
          url: "https://monitor.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] == 200"

        - name: Headlamp
          group: 4. Internal
          url: "https://k8s.simplelumine.dev"
          interval: 60s
          conditions:
            - "[STATUS] < 500"
