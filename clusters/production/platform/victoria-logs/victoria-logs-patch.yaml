apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: victoria-logs-single
  namespace: monitoring
spec:
  # Reduce retention to save space on small 15GB disk
  retentionPeriod: "7d"
  
  # Pin log storage to dedicated monitoring node
  nodeSelector:
    node-role.kubernetes.io/monitoring: "true"
  tolerations:
    - key: "node-role.kubernetes.io/monitoring"
      operator: "Exists"
      effect: "NoSchedule"