apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: victoria-logs-single
  namespace: monitoring
spec:
  # Retention period for log storage
  retentionPeriod: "15d"
  
  # Pin log storage to non-critical node
  nodeSelector:
    node-role.kubernetes.io/non-critical: "true"
  tolerations:
    - key: "node-role.kubernetes.io/non-critical"
      operator: "Exists"
      effect: "NoSchedule"