apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  values:
    image:
      registry: codeberg.org
      repository: forgejo/forgejo
      tag: 16-rootless

    # Disable bundled subcharts
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    valkey-cluster:
      enabled: false

    # Deployment Strategy (Recreate to prevent LevelDB & PVC lock collision during updates)
    strategy:
      type: Recreate

    # Custom templates (pure SSO CSS) via native Kubernetes ConfigMap mount
    extraVolumes:
      - name: custom-templates
        configMap:
          name: forgejo-custom-templates
    extraContainerVolumeMounts:
      - name: custom-templates
        mountPath: /data/gitea/templates/custom/header.tmpl
        subPath: header.tmpl
        readOnly: true

    # Ingress (Traefik + cert-manager)
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: git.simplelumine.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: forgejo-tls
          hosts:
            - git.simplelumine.dev

    # Connect to CNPG PostgreSQL, Cloudflare R2, and Resend SMTP
    deployment:
      env:
        # Database
        - name: FORGEJO__database__DB_TYPE
          value: "postgres"
        - name: FORGEJO__database__HOST
          value: "postgres-rw.postgres.svc.cluster.local:5432"
        - name: FORGEJO__database__NAME
          value: "forgejo"
        - name: FORGEJO__database__USER
          value: "forgejo"
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-db-secret
              key: password

        # Cloudflare R2 (S3 Storage)
        - name: FORGEJO__storage__STORAGE_TYPE
          value: minio
        - name: FORGEJO__storage__MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: s3-endpoint
        - name: FORGEJO__storage__MINIO_BUCKET
          value: "gitea-data"
        - name: FORGEJO__storage__MINIO_LOCATION
          value: "auto"
        - name: FORGEJO__storage__MINIO_USE_SSL
          value: "true"
        - name: FORGEJO__storage__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: s3-access-key-id
        - name: FORGEJO__storage__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: s3-secret-access-key

        # Resend SMTP Password
        - name: FORGEJO__mailer__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: smtp-password

    # Application config & Pure OIDC SSO
    gitea:
      config:
        APP_NAME: "Forgejo"
        server:
          DOMAIN: git.simplelumine.dev
          ROOT_URL: "https://git.simplelumine.dev/"
          REVERSE_PROXY_TRUSTED_PROXIES: "*"
        service:
          DISABLE_REGISTRATION: true
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
          ENABLE_PASSWORD_SIGNIN_FORM: false
          ENABLE_PASSKEY_AUTHENTICATION: false
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: false
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          ACCOUNT_LINKING: auto
        actions:
          ENABLED: true
          DEFAULT_ACTIONS_URL: github

        mailer:
          ENABLED: true
          SMTP_ADDR: smtp.resend.com
          SMTP_PORT: 465
          PROTOCOL: smtps
          USER: resend
          FROM: '"SimpleLumine" <noreply@simplelumine.dev>'

      # OIDC provider (Zitadel)
      oauth:
        - name: SimpleLumine
          provider: openidConnect
          existingSecret: forgejo-secrets
          autoDiscoverUrl: "https://auth.simplelumine.dev/.well-known/openid-configuration"

    persistence:
      enabled: true
      size: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
