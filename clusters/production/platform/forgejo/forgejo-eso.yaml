apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-secret-sync
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres-store
    kind: ClusterSecretStore
  target:
    name: forgejo-db-secret
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: forgejo-db-secret
        property: username
    - secretKey: password
      remoteRef:
        key: forgejo-db-secret
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-app-secret-sync
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: forgejo-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # OIDC
        key: '{{ index . "oauth-client-id" }}'
        secret: '{{ index . "oauth-client-secret" }}'
        # S3 / Cloudflare R2
        s3-endpoint: '{{ index . "s3-endpoint" | trimPrefix "https://" | trimPrefix "http://" }}'
        s3-access-key-id: '{{ index . "s3-access-key-id" }}'
        s3-secret-access-key: '{{ index . "s3-secret-access-key" }}'
        # Resend SMTP
        smtp-password: '{{ index . "smtp-password" }}'
  dataFrom:
    - extract:
        key: forgejo-secrets
