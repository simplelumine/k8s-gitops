apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../platform/blackbox-exporter
  - vmprobe.yaml

configMapGenerator:
  - name: blackbox-dashboard
    namespace: monitoring
    files:
      - dashboards/blackbox-exporter.json

generatorOptions:
  labels:
    grafana_dashboard: "1"

patches:
  - path: blackbox-exporter-patch.yaml
