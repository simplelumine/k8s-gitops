apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-id
  namespace: simple-id
spec:
  values:
    imagePullSecrets:
      - name: image-pull-secret

    ingress:
      enabled: true
      className: traefik
      host: id.simplelumine.dev
      tls:
        secretName: id-simplelumine-dev-tls

    auth:
      issuer: "https://id.simplelumine.dev"
      edgeCookieDomain: ".simplelumine.dev"
      minAccountAgeDays: 7
      existingSecret: "simple-id-secrets"

    forwardAuthMiddleware:
      enabled: true
      name: simple-id-admin-auth
      role: "admin"

    postgres:
      enabled: false
      host: "postgres-rw.postgres.svc.cluster.local"
      port: 5432
      db: "simple-id"
      user: "simple-id"
      existingSecret: "simple-id-db-credentials"
      secretKey: "password"
      sslmode: "disable"
