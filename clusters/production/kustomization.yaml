apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - flux-sync

patches:
  - patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        interval: 6h
    target:
      kind: Kustomization
      name: flux-system
      namespace: flux-system
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-leader-election=false
    target:
      kind: Deployment
      name: "(source|kustomize|helm|notification)-controller"
      namespace: flux-system
