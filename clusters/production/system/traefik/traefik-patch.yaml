apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  values:
    deployment:
      replicas: 2

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik

    nodeSelector:
      svccontroller.k3s.cattle.io/enablelb: "true"

    # CP node removed from traffic path - Traefik only runs on pro nodes
    # tolerations for control-plane intentionally omitted

    service:
      spec:
        type: LoadBalancer
        loadBalancerSourceRanges:
          # Internal WireGuard Mesh & Kubernetes CIDRs
          - 10.10.0.0/16
          - 10.42.0.0/16
          - 10.43.0.0/16
          # Official Cloudflare IPv4 Origin Ranges
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          # Official Cloudflare IPv6 Origin Ranges
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
