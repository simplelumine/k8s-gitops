apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  values:
    domain: "simplelumine.dev"
    secret:
      existingSecret: "authelia-secret"
    pod:
      extraEnv:
        - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authelia-db-secret
              key: AUTHELIA_STORAGE_POSTGRES_PASSWORD
    configMap:
      theme: "dark"
      default_redirection_url: "https://auth.simplelumine.dev"
      session:
        domain: "simplelumine.dev"
        expiration: 3600
        inactivity: 300
        redis:
          host: "redis.redis.svc.cluster.local"
          port: 6379
      storage:
        postgres:
          address: "tcp://postgres-rw.postgres.svc.cluster.local:5432"
          database: "authelia"
          username: "authelia"
          password:
            path: "storage.postgres.password"
      authentication_backend:
        ldap:
          implementation: lldap
          address: "ldap://lldap.lldap.svc.cluster.local:3890"
          base_dn: "dc=simplelumine,dc=dev"
          user: "cn=admin,ou=people,dc=simplelumine,dc=dev"
          password:
            path: "authentication.backend.ldap.password"
      notifier:
        smtp:
          enabled: true
          host: "smtp.resend.com"
          port: 465
          username: "resend"
          sender: "Authelia <auth@simplelumine.dev>"
          password:
            path: "notifier.smtp.password"
