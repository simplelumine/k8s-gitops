apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  values:
    secret:
      existingSecret: "authelia-secret"
      additionalSecrets:
        authelia-secret:
          path: "custom"
    configMap:
      theme: "dark"
      access_control:
        default_policy: bypass
        rules:
          - domain: "gemini.simplelumine.dev"
            resources:
              - "^/ui.*"
              - "^/api.*"
            policy: two_factor
            subject:
              - "group:admins"
          - domain: "k8s.simplelumine.dev"
            policy: two_factor
            subject:
              - "group:admins"
      session:
        cookies:
          - domain: "simplelumine.dev"
            subdomain: "auth"
            default_redirection_url: "https://simplelumine.dev"
        expiration: "1 hour"
        inactivity: "5 minutes"
        redis:
          enabled: true
          host: "redis.redis.svc.cluster.local"
          port: 6379
      storage:
        postgres:
          enabled: true
          address: "tcp://postgres-rw.postgres.svc.cluster.local:5432"
          database: "authelia"
          username: "authelia"
      authentication_backend:
        ldap:
          enabled: true
          implementation: "lldap"
          address: "ldap://lldap.lldap.svc.cluster.local:3890"
          base_dn: "dc=simplelumine,dc=dev"
          user: "cn=admin,ou=people,dc=simplelumine,dc=dev"
          password:
            path: "authentication.ldap.password.txt"
      notifier:
        smtp:
          enabled: true
          address: "submissions://smtp.resend.com:465"
          username: "resend"
          sender: "Authelia <auth@simplelumine.dev>"
          password:
            path: "notifier.smtp.password.txt"
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            path: "identity_providers.oidc.hmac.key"
          jwks:
            - key_id: "default"
              algorithm: "RS256"
              use: "sig"
              key:
                path: "/secrets/custom/identity_providers.oidc.jwks.key.rsa.2048.1.key"
          cors:
            endpoints:
              - "authorization"
              - "token"
              - "userinfo"
            allowed_origins_from_client_redirect_uris: true
          claims_policies:
            grafana:
              id_token:
                - "email"
                - "email_verified"
                - "groups"
                - "preferred_username"
                - "name"
          clients:
            - client_id: "ghostfolio"
              client_name: "Ghostfolio"
              client_secret:
                path: "/secrets/custom/identity_providers.oidc.clients.ghostfolio.client_secret.txt"
              public: false
              authorization_policy: "two_factor"
              redirect_uris:
                - "https://invest.simplelumine.dev/api/auth/oidc/callback"
              scopes:
                - "openid"
                - "profile"
                - "email"
              response_types:
                - "code"
              grant_types:
                - "authorization_code"
              userinfo_signed_response_alg: "none"
              token_endpoint_auth_method: "client_secret_post"
            - client_id: "open-webui"
              client_name: "Open WebUI"
              client_secret:
                path: "/secrets/custom/identity_providers.oidc.clients.openwebui.client_secret.txt"
              public: false
              authorization_policy: "two_factor"
              require_pkce: true
              pkce_challenge_method: "S256"
              redirect_uris:
                - "https://chat.simplelumine.dev/oauth/oidc/callback"
              scopes:
                - "openid"
                - "profile"
                - "groups"
                - "email"
              response_types:
                - "code"
              grant_types:
                - "authorization_code"
              userinfo_signed_response_alg: "none"
              token_endpoint_auth_method: "client_secret_basic"
            - client_id: "vikunja"
              client_name: "Vikunja"
              client_secret:
                path: "/secrets/custom/identity_providers.oidc.clients.vikunja.client_secret.txt"
              public: false
              authorization_policy: "two_factor"
              redirect_uris:
                - "https://tasks.simplelumine.dev/auth/openid/authelia"
              scopes:
                - "openid"
                - "profile"
                - "email"
              response_types:
                - "code"
              grant_types:
                - "authorization_code"
              userinfo_signed_response_alg: "none"
              token_endpoint_auth_method: "client_secret_basic"
            - client_id: "grafana"
              client_name: "Grafana"
              claims_policy: "grafana"
              client_secret:
                path: "/secrets/custom/identity_providers.oidc.clients.grafana.client_secret.txt"
              public: false
              authorization_policy: "two_factor"
              require_pkce: true
              pkce_challenge_method: "S256"
              redirect_uris:
                - "https://monitor.simplelumine.dev/login/generic_oauth"
              scopes:
                - "openid"
                - "profile"
                - "email"
                - "groups"
              response_types:
                - "code"
              grant_types:
                - "authorization_code"
              userinfo_signed_response_alg: "none"
              token_endpoint_auth_method: "client_secret_basic"


