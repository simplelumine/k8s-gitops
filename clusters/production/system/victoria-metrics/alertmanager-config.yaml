apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal:
          - namespace

    route:
      group_by: ['namespace', 'alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'discord-notifications'
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: 'null'

    receivers:
      - name: 'null'
      - name: 'discord-notifications'
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord-webhook/webhook-url
            send_resolved: true
