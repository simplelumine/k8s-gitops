apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  values:
    fullnameOverride: "victoria-metrics"

    grafana:
      nodeSelector:
        node-role.kubernetes.io/monitoring: "true"
      tolerations:
        - key: "node-role.kubernetes.io/monitoring"
          operator: "Exists"
          effect: "NoSchedule"
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - monitor.simplelumine.dev
        tls:
          - secretName: grafana-tls
            hosts:
              - monitor.simplelumine.dev

      plugins:
        - victoriametrics-logs-datasource

      # service:
      #   annotations:
      #     tailscale.com/expose: "true"
      #     tailscale.com/hostname: "victoria-metrics"

      # Inject secret values as Environment Variables
      envFromSecret: victoria-metrics-auth

      # Configure Grafana.ini to use Env Vars
      grafana.ini:
        server:
          domain: monitor.simplelumine.dev
          root_url: https://monitor.simplelumine.dev
          serve_from_sub_path: false

        auth.github:
          enabled: true
          allow_sign_up: true
          # Read from Env Vars injected by envFromSecret
          client_id: ${GF_AUTH_GITHUB_CLIENT_ID}
          client_secret: ${GF_AUTH_GITHUB_CLIENT_SECRET}
          scopes: user:email,read:org
          auth_url: https://github.com/login/oauth/authorize
          token_url: https://github.com/login/oauth/access_token
          api_url: https://api.github.com/user
          # Replace with your GitHub Organization
          allowed_organizations: lumine-duality
          # Map GitHub Teams to Grafana Roles
          role_attribute_path: "contains(groups[*], '@lumine-duality/admins') && 'Admin' || 'Viewer'"

        auth.generic_oauth:
          enabled: true
          name: "Authelia"
          allow_sign_up: true
          auto_login: false
          client_id: "grafana"
          client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: "openid profile email groups"
          auth_url: "https://auth.simplelumine.dev/api/oidc/authorization"
          token_url: "https://auth.simplelumine.dev/api/oidc/token"
          api_url: "https://auth.simplelumine.dev/api/oidc/userinfo"
          use_pkce: true
          groups_attribute_path: "groups"
          role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
          role_attribute_strict: false
          allow_assign_grafana_admin: true


    # Pin all monitoring components to the dedicated monitoring node
    vmsingle:
      spec:
        retentionPeriod: "7d"
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"

    vmagent:
      spec:
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"

    vmalert:
      spec:
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"

    vmalertmanager:
      spec:
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"
