apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  values:
    fullnameOverride: "victoria-metrics"

    # Disable unexposed control-plane scrapers for k3s
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false

    grafana:
      nodeSelector:
        node-role.kubernetes.io/monitoring: "true"
      tolerations:
        - key: "node-role.kubernetes.io/monitoring"
          operator: "Exists"
          effect: "NoSchedule"
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - monitor.simplelumine.dev
        tls:
          - secretName: grafana-tls
            hosts:
              - monitor.simplelumine.dev

      plugins:
        - victoriametrics-logs-datasource

      # service:
      #   annotations:
      #     tailscale.com/expose: "true"
      #     tailscale.com/hostname: "victoria-metrics"

      # Inject secret values as Environment Variables
      envFromSecret: victoria-metrics-auth

      # Configure Grafana.ini to use Env Vars
      grafana.ini:
        server:
          domain: monitor.simplelumine.dev
          root_url: https://monitor.simplelumine.dev
          serve_from_sub_path: false

        auth.generic_oauth:
          enabled: true
          name: "SimpleLumine SSO"
          allow_sign_up: true
          auto_login: false
          client_id: "387493081940821083"
          client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: "openid profile email urn:zitadel:iam:org:project:roles"
          auth_url: "https://auth.simplelumine.dev/oauth/v2/authorize"
          token_url: "https://auth.simplelumine.dev/oauth/v2/token"
          api_url: "https://auth.simplelumine.dev/oidc/v1/userinfo"
          use_pkce: true
          role_attribute_path: "contains(keys(\"urn:zitadel:iam:org:project:roles\"), 'admin') && 'Admin' || 'Viewer'"
          role_attribute_strict: false
          allow_assign_grafana_admin: true


    # Pin all monitoring components to the dedicated monitoring node
    vmsingle:
      spec:
        retentionPeriod: "7d"
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"

    vmagent:
      spec:
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"

    vmalert:
      spec:
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"

    alertmanager:
      spec:
        configSecret: alertmanager-config
        secrets:
          - discord-webhook
        nodeSelector:
          node-role.kubernetes.io/monitoring: "true"
        tolerations:
          - key: "node-role.kubernetes.io/monitoring"
            operator: "Exists"
            effect: "NoSchedule"
