apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  values:
    fullnameOverride: "victoria-metrics"

    # Disable unexposed control-plane scrapers for k3s
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false

    # Keep kube-apiserver core metrics on CP node but drop high-cardinality histogram buckets (>90% payload reduction)
    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              interval: "60s"
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels:
                    - __name__
                  regex: ".*_bucket"

    # Exclude CP node from kubelet/cadvisor/probes/resources scrapes (avoids scraping K3s monolithic /metrics twice)
    kubelet:
      vmScrape:
        spec:
          interval: "60s"
          selector:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

    # Allow node-exporter to tolerate CP node's NoExecute taint so CP host metrics stay monitored
    prometheus-node-exporter:
      tolerations:
        - operator: Exists

    # Exclude high-churn leases from kube-state-metrics cluster-wide watch
    kube-state-metrics:
      collectors:
        - certificatesigningrequests
        - configmaps
        - cronjobs
        - daemonsets
        - deployments
        - endpointslices
        - horizontalpodautoscalers
        - ingresses
        - jobs
        - limitranges
        - mutatingwebhookconfigurations
        - namespaces
        - networkpolicies
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - poddisruptionbudgets
        - pods
        - replicasets
        - replicationcontrollers
        - resourcequotas
        - secrets
        - services
        - statefulsets
        - storageclasses
        - validatingwebhookconfigurations
        - volumeattachments

    grafana:
      nodeSelector:
        node-role.kubernetes.io/observability: "true"
      tolerations:
        - key: "node-role.kubernetes.io/observability"
          operator: "Exists"
          effect: "NoSchedule"
      resources:
        requests:
          cpu: 20m
          memory: 256Mi
        limits:
          memory: 448Mi
      sidecar:
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            memory: 96Mi
        dashboards:
          watchMethod: SLEEP
          resource: configmap
          searchNamespace: monitoring
          env:
            SLEEP_TIME: "300"
        datasources:
          watchMethod: SLEEP
          resource: configmap
          searchNamespace: monitoring
          env:
            SLEEP_TIME: "300"
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - monitor.simplelumine.dev
        tls:
          - secretName: grafana-tls
            hosts:
              - monitor.simplelumine.dev

      # service:
      #   annotations:
      #     tailscale.com/expose: "true"
      #     tailscale.com/hostname: "victoria-metrics"

      # Inject secret values as Environment Variables
      envFromSecret: victoria-metrics-auth

      # Configure Grafana.ini to use Env Vars
      grafana.ini:
        server:
          domain: monitor.simplelumine.dev
          root_url: https://monitor.simplelumine.dev
          serve_from_sub_path: false

        auth.generic_oauth:
          enabled: true
          name: "SimpleLumine"
          allow_sign_up: true
          auto_login: false
          client_id: "387493081940821083"
          client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: "openid profile email urn:zitadel:iam:org:project:roles"
          auth_url: "https://auth.simplelumine.dev/oauth/v2/authorize"
          token_url: "https://auth.simplelumine.dev/oauth/v2/token"
          api_url: "https://auth.simplelumine.dev/oidc/v1/userinfo"
          use_pkce: true
          role_attribute_path: "contains(keys(\"urn:zitadel:iam:org:project:roles\"), 'admin') && 'Admin' || 'Viewer'"
          role_attribute_strict: false
          allow_assign_grafana_admin: true


    # Pin all monitoring components to the observability node
    vmsingle:
      spec:
        retentionPeriod: "30d"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            memory: "768Mi"
        nodeSelector:
          node-role.kubernetes.io/observability: "true"
        tolerations:
          - key: "node-role.kubernetes.io/observability"
            operator: "Exists"
            effect: "NoSchedule"

    vmagent:
      spec:
        scrapeInterval: "40s"
        nodeSelector:
          node-role.kubernetes.io/observability: "true"
        tolerations:
          - key: "node-role.kubernetes.io/observability"
            operator: "Exists"
            effect: "NoSchedule"

    vmalert:
      spec:
        evaluationInterval: "60s"
        nodeSelector:
          node-role.kubernetes.io/observability: "true"
        tolerations:
          - key: "node-role.kubernetes.io/observability"
            operator: "Exists"
            effect: "NoSchedule"

    alertmanager:
      spec:
        configSecret: alertmanager-config
        secrets:
          - discord-webhook
        nodeSelector:
          node-role.kubernetes.io/observability: "true"
        tolerations:
          - key: "node-role.kubernetes.io/observability"
            operator: "Exists"
            effect: "NoSchedule"
