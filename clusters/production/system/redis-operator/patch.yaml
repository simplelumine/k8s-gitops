apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: ot-operators
spec:
  values:
    redisOperator:
      watchNamespace: "redis"
      extraArgs:
        - --leader-elect=false
    manager:
      config:
        kubeClientQPS: 2
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
