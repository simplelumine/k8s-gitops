apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: datastores
  namespace: flux-system
spec:
  dependsOn:
    - name: system
  interval: 10m
  path: ./clusters/production/datastores
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system-prod
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
