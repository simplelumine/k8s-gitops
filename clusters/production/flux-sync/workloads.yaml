apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads
  namespace: flux-system
spec:
  dependsOn:
    - name: system
    - name: datastores
    - name: platform
  interval: 6h
  path: ./clusters/production/workloads
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system-prod
