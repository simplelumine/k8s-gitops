apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  dependsOn:
    - name: datastores
    - name: system
  interval: 6h
  path: ./clusters/production/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system-prod
