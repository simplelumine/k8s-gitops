apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  managed:
    roles:
      - name: open-webui
        ensure: present
        login: true
        passwordSecret:
          name: open-webui-db-secret
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret:
          name: vaultwarden-db-secret
      - name: zitadel
        ensure: present
        login: true
        passwordSecret:
          name: zitadel-db-secret
      - name: gatus
        ensure: present
        login: true
        passwordSecret:
          name: gatus-db-secret
      - name: simple-core
        ensure: present
        login: true
        passwordSecret:
          name: simple-core-db-secret
      - name: simple-id
        ensure: present
        login: true
        passwordSecret:
          name: simple-id-db-secret

