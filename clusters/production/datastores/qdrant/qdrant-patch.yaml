apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
  namespace: qdrant
spec:
  values:
    # --- Single Node Configuration ---
    # Single node with S3 backup is the most pragmatic setup for homelab.
    # If HA is needed later, use the Qdrant Migration Tool to move to a cluster.
    replicaCount: 1

    priorityClassName: high

    config:
      cluster:
        enabled: false
      storage:
        snapshots_config:
          snapshots_storage: s3
          s3_config:
            bucket: prod-qd-backups
            region: auto
            endpoint_url: ${R2_ENDPOINT_URL}

    # --- S3 Credentials via Environment Variables ---
    # Qdrant supports QDRANT__ prefixed env vars to override config values
    env:
      - name: QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: qdrant-secret
            key: r2-access-key-id
      - name: QDRANT__STORAGE__SNAPSHOTS_CONFIG__S3_CONFIG__SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: qdrant-secret
            key: r2-secret-access-key

    # --- Security ---
    apiKey:
      valueFrom:
        secretKeyRef:
          name: qdrant-secret
          key: api-key

    # --- Ingress ---
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth2-proxy-errors@kubernetescrd,oauth2-proxy-oauth2-proxy-auth@kubernetescrd
      hosts:
        - host: vector.simplelumine.dev
          paths:
            - path: /
              pathType: Prefix
              servicePort: 6333
      tls:
        - secretName: qdrant-tls
          hosts:
            - vector.simplelumine.dev


