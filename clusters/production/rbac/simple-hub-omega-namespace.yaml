apiVersion: v1
kind: Namespace
metadata:
  name: simple-hub-omega
  labels:
    purpose: development
    owner: omega
    project: simple-hub
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: simple-hub-omega-quota
  namespace: simple-hub-omega
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "3"
    limits.memory: 6Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: simple-hub-omega-limit-range
  namespace: simple-hub-omega
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
