apiVersion: v1
kind: Namespace
metadata:
  name: omega-dev
  labels:
    purpose: development
    owner: omega
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: omega-quota
  namespace: omega-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "3"
    limits.memory: 6Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: omega-limit-range
  namespace: omega-dev
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
