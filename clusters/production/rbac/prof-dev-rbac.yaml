apiVersion: v1
kind: ServiceAccount
metadata:
  name: prof
  namespace: prof-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prof-admin
  namespace: prof-dev
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/portforward
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prof-admin-binding
  namespace: prof-dev
subjects:
  - kind: ServiceAccount
    name: prof
    namespace: prof-dev
roleRef:
  kind: Role
  name: prof-admin
  apiGroup: rbac.authorization.k8s.io
