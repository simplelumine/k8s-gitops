apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-gemini
  namespace: simple-gemini
spec:
  values:
    imagePullSecrets:
      - name: image-pull-secret
    worker:
      replicaCount: 2
    browser:
      replicaCount: 4
    service:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "simple-gemini"

    ingress:
      enabled: false

    # --- Infrastructure Configuration ---
    redis:
      deploy: false
      external:
        mode: "sentinel"
        sentinel:
          addrs: "redis-s-hl.redis.svc.cluster.local:26379"
          masterName: "mymaster"
        passwordSecret:
          name: "simple-gemini-secrets"
          key: "REDIS_PASSWORD"
    storage:
      s3:
        existingSecret: "simple-gemini-secrets"
        existingSecretEndpointKey: "S3_ENDPOINT"
        existingSecretBucketKey: "S3_BUCKET"
        existingSecretAccessKey: "S3_ACCESS_KEY_ID"
        existingSecretSecretKey: "S3_SECRET_ACCESS_KEY"
