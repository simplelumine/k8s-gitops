apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-gemini
  namespace: simple-gemini
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: simple-id-simple-id-admin-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gemini.simplelumine.dev
      secretName: simple-gemini-tls
  rules:
    - host: gemini.simplelumine.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-gemini-controller
                port:
                  number: 8080
