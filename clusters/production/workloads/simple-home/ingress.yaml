apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-home
  namespace: simple-home
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: simplelumine.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-home
                port:
                  number: 8080
  tls:
    - hosts:
        - simplelumine.dev
      secretName: simple-home-tls
