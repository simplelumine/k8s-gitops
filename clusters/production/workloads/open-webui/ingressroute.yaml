apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui-edge
  namespace: open-webui
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`chat-lax.simplelumine.dev`) || Host(`chat-tyo.simplelumine.dev`)
      kind: Rule
      services:
        - name: open-webui
          port: 80
  tls: {}
