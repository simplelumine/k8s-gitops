apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 6h
  values:
    websocket:
      enabled: true
      # Using external Redis (defined by 'url'), so internal redis is disabled but manager is set to redis
      manager: redis
      url: redis://redis-master.redis.svc.cluster.local:6379/0
      redis:
        enabled: false
    ollama:
      enabled: false
    pipelines:
      enabled: false
    tika:
      enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi
    persistence:
      enabled: false

    ingress:
      enabled: true
      class: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      host: chat.simplelumine.dev
      tls: true
      existingSecret: open-webui-tls

    commonEnvVars:
      - name: OFFLINE_MODE
        value: "true"
      - name: ENABLE_OPENAI_API
        value: "true"
      - name: ENABLE_ADMIN_EXPORT
        value: "false"
      - name: ENABLE_ADMIN_CHAT_ACCESS
        value: "false"
      - name: BYPASS_ADMIN_ACCESS_CONTROL
        value: "false"
      - name: CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE
        value: "10485760"
      - name: REPLACE_IMAGE_URLS_IN_CHAT_RESPONSE
        value: "true"
      - name: BYPASS_EMBEDDING_AND_RETRIEVAL
        value: "true"

    extraEnvVars:
      # S3 Storage Configuration (all via extraEnvVars to avoid merge conflicts with chart-generated env)
      - name: STORAGE_PROVIDER
        value: "s3"
      - name: S3_ENDPOINT_URL
        valueFrom:
          secretKeyRef:
            name: open-webui-secret
            key: s3-endpoint-url
      - name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: open-webui-secret
            key: s3-access-key-id
      - name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui-secret
            key: s3-secret-access-key
      - name: S3_BUCKET_NAME
        value: "open-webui-data"
      - name: S3_REGION_NAME
        value: "auto"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: open-webui-db-secret
            key: DATABASE_URL
      # --- Native Login Only (OIDC / ZITADEL removed) ---
      - name: ENABLE_LOGIN_FORM
        value: "true"
      - name: ENABLE_SIGNUP
        value: "false"
      - name: ENABLE_PASSWORD_AUTH
        value: "true"
      - name: ENABLE_PASSWORD_CHANGE_FORM
        value: "true"

    priorityClassName: high

    resources:
      requests:
        memory: "768Mi"
      limits:
        memory: "1024Mi"

    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  cnpg.io/cluster: postgres
                  cnpg.io/instanceRole: primary
              topologyKey: topology.kubernetes.io/zone
