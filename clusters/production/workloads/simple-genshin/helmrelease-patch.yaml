apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-genshin
  namespace: simple-genshin
spec:
  values:
    imagePullSecrets:
      - name: image-pull-secret

    nodeSelector:
      kubernetes.io/arch: amd64
      topology.kubernetes.io/zone: sfo
      kubernetes.io/hostname: sfo-wk-02

    resources:
      requests:
        cpu: 1000m
        memory: 2560Mi
      limits:
        cpu: 3000m
        memory: 3584Mi
