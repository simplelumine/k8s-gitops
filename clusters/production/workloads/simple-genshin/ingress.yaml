apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-genshin
  namespace: simple-genshin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: genshin.simplelumine.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sdk
                port:
                  number: 80
  tls:
    - hosts:
        - genshin.simplelumine.dev
      secretName: simple-genshin-tls
