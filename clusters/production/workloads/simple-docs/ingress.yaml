apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-docs
  namespace: simple-docs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: docs.simplelumine.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-docs
                port:
                  number: 8080
  tls:
    - hosts:
        - docs.simplelumine.dev
      secretName: simple-docs-tls
