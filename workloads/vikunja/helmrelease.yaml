apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: vikunja
spec:
  interval: 15m
  chart:
    spec:
      chart: vikunja
      version: "v2.0.2"
      sourceRef:
        kind: HelmRepository
        name: vikunja
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
