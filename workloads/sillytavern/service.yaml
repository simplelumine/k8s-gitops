apiVersion: v1
kind: Service
metadata:
  name: sillytavern
  namespace: sillytavern
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "sillytavern"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sillytavern
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
