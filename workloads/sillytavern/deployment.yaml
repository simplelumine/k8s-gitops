apiVersion: apps/v1
kind: Deployment
metadata:
  name: sillytavern
  namespace: sillytavern
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sillytavern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sillytavern
    spec:
      runtimeClassName: gvisor
      priorityClassName: low
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
        options:
          - name: ndots
            value: "1"
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-storage-dirs
          image: ghcr.io/sillytavern/sillytavern:1.19.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /storage/config /storage/data /storage/plugins /storage/extensions /storage/backups
              if [ ! -f /storage/config/config.yaml ]; then
                cp /home/node/app/default/config.yaml /storage/config/config.yaml
                sed -i 's/^whitelistMode: true/whitelistMode: false/' /storage/config/config.yaml
                sed -i 's/^enableUserAccounts: false/enableUserAccounts: true/' /storage/config/config.yaml
                sed -i '/^browserLaunch:/,/^  enabled:/ s/enabled: true/enabled: false/' /storage/config/config.yaml
                sed -i '/^privateAddressWhitelist:/,/^  enabled:/ s/enabled: false/enabled: true/' /storage/config/config.yaml
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /storage
      containers:
        - name: sillytavern
          image: ghcr.io/sillytavern/sillytavern:1.19.1
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: storage
              mountPath: /home/node/app/config
              subPath: config
            - name: storage
              mountPath: /home/node/app/data
              subPath: data
            - name: storage
              mountPath: /home/node/app/plugins
              subPath: plugins
            - name: storage
              mountPath: /home/node/app/public/scripts/extensions/third-party
              subPath: extensions
            - name: storage
              mountPath: /home/node/app/backups
              subPath: backups
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sillytavern-storage
