apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-cloud
  namespace: simple-cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: simple-cloud-chart
      version: ">=0.0.1"
      sourceRef:
        kind: HelmRepository
        name: simple-cloud
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
