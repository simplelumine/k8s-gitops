apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-pull-secret-sync
  namespace: simple-cli
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-store
  dataFrom:
    - extract:
        key: container-registry-secrets
  target:
    name: image-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .ghcr_username }}",
                "password": "{{ .ghcr_password }}"
              }
            }
          }
