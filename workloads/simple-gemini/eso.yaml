apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: simple-gemini-git-auth-sync
  namespace: simple-gemini
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: simple-gemini-git-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: github-pat-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret-sync
  namespace: simple-gemini
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}"}}}'
  dataFrom:
    - extract:
        key: github-pat-secrets
