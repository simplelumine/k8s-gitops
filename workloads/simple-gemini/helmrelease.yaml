apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-gemini
  namespace: simple-gemini
spec:
  interval: 5m
  chart:
    spec:
      chart: simple-gemini-chart
      version: "^2.0.0"
      sourceRef:
        kind: HelmRepository
        name: simple-gemini
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

