apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-hub
  namespace: simple-hub
spec:
  interval: 5m
  chart:
    spec:
      chart: simple-hub-chart
      version: ">=0.0.1"
      sourceRef:
        kind: HelmRepository
        name: simple-hub
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
