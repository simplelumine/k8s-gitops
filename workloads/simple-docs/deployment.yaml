apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-docs
  namespace: simple-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-docs
    spec:
      imagePullSecrets:
        - name: image-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simple-docs
          image: ghcr.io/simplelumine/simple-docs:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: simple-docs
  namespace: simple-docs
spec:
  selector:
    app.kubernetes.io/name: simple-docs
  ports:
    - name: http
      port: 8080
      targetPort: 8080
