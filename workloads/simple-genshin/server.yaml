# Game Realm Server + HMAC Agent (pinned to linux/amd64; auto-pulls engine & save from R2)
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: simple-genshin
spec:
  selector:
    app.kubernetes.io/name: genshin-server
  ports:
    - name: agent-http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genshin-server
  namespace: simple-genshin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: genshin-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genshin-server
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: image-pull-secret
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: server
          image: ghcr.io/simplelumine/simple-genshin-server:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: agent-http
              containerPort: 8081
              protocol: TCP
            - name: game-udp
              containerPort: 21081
              hostPort: 21081
              protocol: UDP
          envFrom:
            - secretRef:
                name: simple-genshin-secrets
          env:
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simple-genshin-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: SDK_HOST
              value: "sdk"
            - name: S3_BACKUP_INTERVAL
              value: "21600"
          readinessProbe:
            httpGet:
              path: /agent/livez
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 3.5Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: engine-data
              mountPath: /opt/engine
            - name: agent-state
              mountPath: /data/agent
  volumeClaimTemplates:
    - metadata:
        name: engine-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 6Gi
    - metadata:
        name: agent-state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
