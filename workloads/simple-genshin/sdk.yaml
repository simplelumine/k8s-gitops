# Central Self-Contained SDK & Simple ID Portal (multi-arch: runs natively on arm64/amd64)
apiVersion: v1
kind: Service
metadata:
  name: sdk
  namespace: simple-genshin
spec:
  selector:
    app.kubernetes.io/name: genshin-sdk
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genshin-sdk
  namespace: simple-genshin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: sdk
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: genshin-sdk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genshin-sdk
    spec:
      imagePullSecrets:
        - name: image-pull-secret
      containers:
        - name: sdk
          image: ghcr.io/simplelumine/simple-genshin-sdk:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: simple-genshin-secrets
          env:
            - name: SERVER_AGENT_URL
              value: "http://server:8081"
            - name: SESSION_COOKIE_SECURE
              value: "true"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: sdk-data
              mountPath: /app/storage
  volumeClaimTemplates:
    - metadata:
        name: sdk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
