apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simple-core
  namespace: simple-core
spec:
  interval: 6h
  chart:
    spec:
      chart: simple-core-chart
      version: ">=0.0.1"
      sourceRef:
        kind: HelmRepository
        name: simple-core
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
