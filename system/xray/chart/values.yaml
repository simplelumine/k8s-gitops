image:
  repository: ghcr.io/xtls/xray-core
  tag: "v24.12.31"
  pullPolicy: IfNotPresent

secretName: xray-config

reality:
  sni: ""
  dest: ""
  serverNames: []

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 500m
    memory: 64Mi

# Tolerations allowing Xray to be scheduled on control-plane and monitoring nodes
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/monitoring"
    operator: "Exists"
    effect: "NoSchedule"

# Default is empty in base chart; nodes are specified via overlay patch in cluster directory
nodes: []
