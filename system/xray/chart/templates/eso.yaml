apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "xray.fullname" . }}-config-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xray.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "tag": "reality-in",
                "listen": "0.0.0.0",
                "port": 8443,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "{{ `{{ .u_admin }}` }}",
                      "email": "admin",
                      "level": 0,
                      "flow": "xtls-rprx-vision"
                    },
                    {
                      "id": "{{ `{{ .u_partner }}` }}",
                      "email": "partner",
                      "level": 0,
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",
                  "realitySettings": {
                    "show": false,
                    "dest": {{ .Values.reality.dest | quote }},
                    "xver": 0,
                    "serverNames": {{ .Values.reality.serverNames | toJson }},
                    "privateKey": "{{ `{{ .reality_private_key }}` }}",
                    "shortIds": [
                      "{{ `{{ .reality_short_id }}` }}"
                    ]
                  }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": [
                    "http",
                    "tls",
                    "quic"
                  ],
                  "routeOnly": true
                }
              },
              {
                "tag": "http-in",
                "listen": "0.0.0.0",
                "port": 10809,
                "protocol": "http"
              },
              {
                "tag": "socks-in",
                "listen": "0.0.0.0",
                "port": 10808,
                "protocol": "socks",
                "settings": {
                  "udp": true
                }
              }
            ],
            "dns": {
              "servers": [
                "1.1.1.1",
                "8.8.8.8",
                "localhost"
              ],
              "queryStrategy": "UseIPv4"
            },
            "outbounds": [
              {
                "tag": "direct",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                },
                "streamSettings": {
                  "sockopt": {
                    "domainStrategy": "UseIPv4"
                  }
                }
              }
            ]
          }
  dataFrom:
    - extract:
        key: xray-secrets
