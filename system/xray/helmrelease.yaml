apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xray
  namespace: xray
spec:
  interval: 1h
  chart:
    spec:
      chart: ./system/xray/chart
      sourceRef:
        kind: GitRepository
        name: flux-system-prod
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
